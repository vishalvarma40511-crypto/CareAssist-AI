services:
  # Backend Web Service
  - type: web
    name: careassist-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.17.0"
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careassist-db
          property: connectionString
      - key: GEMINI_API_KEY
        value: ""  # Set this in your Render dashboard environment settings

  # Frontend Static Site
  - type: static
    name: careassist-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

databases:
  - name: careassist-db
    plan: free
    databaseName: careassist
    user: careassist_user
