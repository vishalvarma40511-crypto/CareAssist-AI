services:
  # Backend Web Service
  - type: web
    name: careassist-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.17.0"
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://postgres:Tvishal%40200@db.ovnjomtgwphcbxjdbldi.supabase.co:5432/postgres"
      - key: GEMINI_API_KEY
        value: ""  # Add your Gemini key in Render dashboard

  # Frontend Static Site
  - type: web
    name: careassist-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: public, max-age=0, must-revalidate
